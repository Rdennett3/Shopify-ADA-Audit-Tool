version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/ada
    depends_on:
      - mongo

  worker:
    build: ./worker
    environment:
      MONGO_URL: mongodb://mongo:27017/ada
    depends_on:
      - mongo

volumes:
  mongo_data: